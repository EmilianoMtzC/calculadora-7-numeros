name: Compilar .exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Empaquetar con PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --name Calculadora7 --add-data "styles.qss;." --add-data "fuentes;fuentes" app.py
      - name: Compilar instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\instalador.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora7-windows
          path: |
            dist/Calculadora7/
            installer/Output/Instalador_Calculadora7.exe
      - name: Adjuntar instalador al release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "${{ github.ref_name }}" installer/Output/Instalador_Calculadora7.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
